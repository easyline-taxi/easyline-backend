<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Status: <span id="status">Disconnected</span></h1>

    <script src="https://cdn.socket.io/3.1.1/socket.io.min.js" integrity="sha384-gDaozqUvc4HTgo8iZjwth73C6dDDeOJsAgpxBcMpZYztUfjHXpzrpdrHRdVp8ySO" crossorigin="anonymous"></script>

    <script>
        socket = io("http://easyline.ml/")
        socket.on('connect', () => {
            if (socket.connected) document.getElementById('status').innerHTML = "Connected";
        })
        socket.on("disconnect", () => {
            if (!socket.connected) document.getElementById('status').innerHTML = "Disconnected"

        });
    </script>

</body>

</html>
